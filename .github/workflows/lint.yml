name: Lint Codebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run JS Lint
        run: bun run lint:js -- --fix
        continue-on-error: true

      - name: Run CSS Lint
        run: bun run lint:css -- --fix
        continue-on-error: true

      - name: Format with Prettier
        run: bun run format
        continue-on-error: true

      - name: Commit and push lint fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix linting issues"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Run HTML Lint
        run: bun run lint:html

  validate-tauri-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Tauri Config
        run: |
          bun run tauri config --print 2>&1 | head -50

      - name: Check Version Sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          
          echo "package.json version: $PKG_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          
          if [ "$PKG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Version mismatch between package.json and tauri.conf.json"
            exit 1
          fi
          
          echo "Versions are in sync ✓"
