<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a1a"/>

  <!-- Outer disc -->
  <circle cx="100" cy="100" r="70" fill="#2b2b2b"/>

  <!-- Grooves -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Center label -->
  <circle cx="100" cy="100" r="18" fill="#888888"/>

  <!-- Center hole -->
  <circle cx="100" cy="100" r="4" fill="#1a1a1a"/>
</svg>